controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPathDWB", "FollowPathMPPI", "FollowPathTEB"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPathDWB:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.26
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.26
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      linear_granularity: 0.02
      angular_granularity: 0.015
      critics: ["Oscillation", "ObstacleFootprint", "PathAlign", "GoalAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 30.0
      GoalAlign.scale: 20.0
      PathDist.scale: 36.0
      GoalDist.scale: 20.0
    FollowPathMPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      temperature: 0.4
      motion_model: "DiffDrive"
      critics: ["ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PreferForwardCritic", "ObstaclesCritic", "PathAlignCritic", "PathAngleCritic", "PathFollowCritic"]
      ConstraintCritic:
        cost_weight: 4.0
      GoalCritic:
        cost_weight: 5.0
      GoalAngleCritic:
        cost_weight: 3.0
      PreferForwardCritic:
        cost_weight: 5.0
      ObstaclesCritic:
        repulsion_weight: 1.3
        critical_weight: 30.0
        collision_margin_distance: 0.08
        cost_scaling_factor: 6.0
      PathAlignCritic:
        cost_weight: 20.0
      PathAngleCritic:
        cost_weight: 2.0
      PathFollowCritic:
        cost_weight: 7.0
    FollowPathTEB:
      plugin: "teb_local_planner::TebLocalPlannerROS"
      footprint_model:
        type: "polygon"
        vertices: "[[-0.18, -0.11], [0.45, -0.11], [0.45, 0.11], [-0.18, 0.11], [-0.33, 0.0]]"
      min_obstacle_dist: 0.2
      inflation_dist: 0.0
      weight_obstacle: 30.0
      no_inner_iterations: 5
      no_outer_iterations: 4
      dt_hysteresis: 0.1
      dt_ref: 0.3
